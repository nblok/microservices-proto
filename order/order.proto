syntax = "proto3";

package order;

option go_package = "github.com/nblok/microservices-proto/golang/order";

// Order is the public gRPC contract for the Order service.
service Order {
  rpc Create(CreateOrderRequest) returns (CreateOrderResponse) {}
}

message CreateOrderRequest {
  // UUID of the customer placing the order (the book uses int64 user_id;
  // this project uses UUIDs in the domain model).
  string customer_id = 1;
  repeated OrderItem order_items = 2;
}

message OrderItem {
  string product_code = 1;
  float unit_price = 2;
  int32 quantity = 3;
}

message CreateOrderResponse {
  // UUID of the created order.
  string order_id = 1;
}
